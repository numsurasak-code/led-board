/* Layout: top app bar + (filter rail | map) on wide screens, stacked on phones. One map instance shared by every screen. */
:root{
  --bg:#f3f4f2;--surface:#ffffff;--surface2:#eef0ec;--ink:#1c2321;--mut:#5f6b66;--line:#dadfda;
  --brand:#8f1d3a;--brand-ink:#ffffff;--focus:#2f6fd6;
  --house:#2463c9;--land:#2f8a4a;--condo:#7a4bc4;--debt:#d23a2a;
  --nobid:#a86a00;--nobid-bg:#fbf0d9;--sold-bg:#e6e8e6;--stop-bg:#ece6f7;--stop:#5b3fa0;--wd-bg:#fbe3df;--wd:#9c2a1d;--pend-bg:#e1eefa;--pend:#1f5f97;
  --mapbg:#eceee9;--road1:#e0973a;--road2:#e8b86a;--road3:#c9cdc6;--road4:#d8dbd5;--bound:#9aa59f;
  --f:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917;--surface:#1c2220;--surface2:#232b28;--ink:#e6ebe8;--mut:#9aa7a1;--line:#323c38;
  --brand:#c2486a;--brand-ink:#ffffff;--focus:#7aa7f0;
  --house:#5b93e8;--land:#5bb877;--condo:#a685e6;--debt:#ef6b5c;
  --nobid:#e3b25a;--nobid-bg:#3a2f18;--sold-bg:#2c3330;--stop-bg:#2e2742;--stop:#c4b2f0;--wd-bg:#41231f;--wd:#f2a69c;--pend-bg:#1d3145;--pend:#9cc6ee;
  --mapbg:#1a201e;--road1:#b9772c;--road2:#8f7448;--road3:#46504c;--road4:#38413d;--bound:#5c6964;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917;--surface:#1c2220;--surface2:#232b28;--ink:#e6ebe8;--mut:#9aa7a1;--line:#323c38;
  --brand:#c2486a;--brand-ink:#ffffff;--focus:#7aa7f0;
  --house:#5b93e8;--land:#5bb877;--condo:#a685e6;--debt:#ef6b5c;
  --nobid:#e3b25a;--nobid-bg:#3a2f18;--sold-bg:#2c3330;--stop-bg:#2e2742;--stop:#c4b2f0;--wd-bg:#41231f;--wd:#f2a69c;--pend-bg:#1d3145;--pend:#9cc6ee;
  --mapbg:#1a201e;--road1:#b9772c;--road2:#8f7448;--road3:#46504c;--road4:#38413d;--bound:#5c6964;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.bar .home{background:transparent;border:1px solid #ffffff55;color:var(--brand-ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.bar h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0;text-wrap:balance}
.bar .sched{font-size:12px;opacity:.9;width:100%}
.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--debt);color:#fff;font-size:11px;text-align:center;margin-left:4px}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto}
/* home */
.home-wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px}
.area h2{font-size:15px;margin:0 0 2px}
.area .meta{color:var(--mut);font-size:13px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;border-top:4px solid var(--c)}
.card:hover{border-color:var(--c)}
.card b{font-size:15px}
.card .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.card .s{font-size:12px;color:var(--mut)}
.mine-all{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.foot{color:var(--mut);font-size:12px;line-height:1.6}
/* map screen */
.mapscreen{display:flex}
.rail{width:280px;flex:none;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 16px;display:grid;gap:12px;align-content:start}
.f b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select,input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dot.dash{border:2px dashed var(--mut)}
.count{font-size:13px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);background:var(--surface2);border-radius:8px;padding:8px 10px;line-height:1.55}
#map{flex:1;min-width:0;background:var(--mapbg)}
.leaflet-container{background:var(--mapbg);font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.roadlbl{background:transparent;border:0;box-shadow:none;color:var(--mut);font-size:11px;font-weight:600}
.roadlbl::before{display:none}
/* popup */
.pop{width:270px;font-size:13px;line-height:1.5}
.pop h3{margin:0 0 6px;font-size:15px}
.pop .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.pop .kv span:nth-child(odd){color:var(--mut);white-space:nowrap}
.pop .kv span{font-variant-numeric:tabular-nums}
.warn{background:var(--wd-bg);color:var(--wd);padding:5px 8px;border-radius:6px;margin:6px 0;font-weight:600}
.approx{background:var(--nobid-bg);color:var(--nobid);padding:5px 8px;border-radius:6px;margin:6px 0}
.hist{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;white-space:nowrap}
.t-sold{background:var(--sold-bg);color:var(--ink)}.t-nobid{background:var(--nobid-bg);color:var(--nobid)}.t-stop{background:var(--stop-bg);color:var(--stop)}.t-wd{background:var(--wd-bg);color:var(--wd)}.t-pend{background:var(--pend-bg);color:var(--pend)}
.ph{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin:2px 0 6px;background:var(--surface2);display:block}
.round{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 6px}
.heat td[style]{background:color-mix(in oklab,var(--house) calc(var(--h)*70%),var(--surface))}.heat td small{color:inherit;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}.kpi span{font-size:12px;color:var(--mut)}
.ana{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:8px}
.ana h3{margin:0;font-size:15px}.ana h4{margin:0 0 4px;font-size:13px;font-weight:600}.ana .tbl{border:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.two>div{min-width:0}
.bars{display:grid;gap:4px}.br{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:12px}
.bl{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{height:12px;background:var(--surface2);border-radius:0 4px 4px 0}
.bf{display:block;height:100%;background:var(--house);border-radius:0 4px 4px 0;min-width:2px}.bv{font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{margin:0;padding-left:20px;display:grid;gap:4px}
.btn.live{background:var(--debt);border-color:var(--debt);color:#fff;font-size:13px;padding:6px 12px}
.th{display:block;width:96px;height:64px;object-fit:cover;border-radius:6px;margin-bottom:4px;background:var(--surface2)}
.am-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.am-cards .card{border-top-width:1px}.am-cards .n{font-size:20px}
.card.office b{font-size:14px}
.leaflet-control-layers-toggle{background-image:none!important;width:auto!important;height:auto!important;padding:6px 10px;font-size:13px;color:var(--ink);text-decoration:none}
.leaflet-control-layers-toggle::after{content:'🛰️ ดาวเทียม / แผนที่'}
.leaflet-control-layers{background:var(--surface);color:var(--ink)}
.btn.park.on{background:var(--stop-bg);border-color:var(--stop);color:var(--stop)}
.emo .badge-star{position:absolute;right:-4px;top:-8px;font-size:13px}.emo{position:relative}.emo.starpin{font-size:24px}
.emo{font-size:22px;line-height:1;text-align:center;filter:drop-shadow(0 1px 1px #0006)}.emo.star{font-size:12px}
.wonbar{background:var(--land);color:#fff;border-radius:6px;padding:6px 8px;margin:-2px 0 6px;font-size:13px}
.seenbox{background:var(--stop-bg);color:var(--ink);border-radius:6px;padding:6px 8px;margin:4px 0 6px;font-size:12px}.seenbox details{margin-top:4px}
.seenrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}.seenrow[data-k]{cursor:pointer}.seenrow .th{flex:none}
.mine-all.alert{border-color:var(--nobid)}
.t-lot{background:var(--pend-bg);color:var(--pend);font-weight:600}
.t-relist{background:var(--stop-bg);color:var(--stop)}.t-old{background:var(--surface2);color:var(--mut);border:1px solid var(--line)}
.prev{border:0;padding:0;margin-top:6px;background:transparent}.prev summary{font-weight:500;font-size:12px;color:var(--mut)}.prev div{font-size:12px}
.t-new{background:var(--land);color:#fff}.t-round{background:var(--surface2);color:var(--ink)}
.notelbl{display:block;font-size:12px;color:var(--mut);margin-top:8px}

small{color:var(--mut)}

<script>

};

for(const [a,A] of Object.entries(AREAS)){

}
const ALIAS={'cy':'cy-all','bk-house':'bk-h','bk-land':'bk-l','bk-condo':'bk-c','analysis':'cy-ana'};
const ST={0:['ยังไม่ถึง','t-pend'],1:['ขายได้','t-sold'],3:['ไม่มีผู้สู้ราคา','t-nobid'],4:['งด (ส่งประกาศมิชอบ)','t-stop'],6:['ถอนการยึด','t-wd'],10:['งดขาย','t-stop'],13:['งดขาย','t-stop'],14:['งดขาย','t-stop'],15:['งดขาย','t-stop'],16:['งดขาย','t-stop'],18:['ถอนการบังคับคดี','t-wd'],26:['งดขายในนัดที่เหลือ','t-stop']};
const st=c=>ST[c]||['งดขาย','t-stop'];
const TH=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fd=d=>d?`${+d.slice(6)} ${TH[+d.slice(4,6)]} ${d.slice(2,4)}`:'-';
const fm=n=>n==null?'-':Math.round(n).toLocaleString('th-TH');
const ceilP=v=>{const u=v>=100000?10000:1000;return Math.ceil(v/u)*u};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);

// ---------- data ----------
const DATA={cy:null,pk:null,bk:null}, BASE={}, HIST={}, ANA={}, SEEN={}, SEENK={};
function derive(r){
  r.k=(r.lot+'|'+r.seq+'|'+r.dn).replace(/[^\w฀-๿|.\- ]/g,'');
  r.condo=/ห้องชุด/.test(r.ty); r.house=!r.condo&&/สิ่งปลูกสร้าง/.test(r.ty); r.land=!r.condo&&!r.house;
  r.kind=r.condo?'c':r.house?'h':'l';
  r.debtOn=r.st==='การจำนองติดไป'; r.ns3=/น\.ส\. ?3/.test(r.lt||'');
  r.tbx=r.am?(r.am+' · '+r.tb):(r.tb||'-');
  const p=(r.a||'0-0-0').split('-'); r.ar=r.condo?(p[2]+' ตร.ม.'):(r.a+' ไร่-งาน-วา');
  const i=r.d.findIndex(d=>d>=TODAY); r.ni=i; r.next=i>=0?r.d[i]:null;
  r.nob=r.s.slice(0,i<0?r.s.length:i).filter(c=>c===3).length;
  r.fac=[1,.9,.8,.7][Math.min(r.nob,3)];
  if(r.debtOn&&!r.fb){ // จำนองติดไป: ประมูลเฉพาะส่วนเกินหนี้ ถ้าหนี้ ≥ ราคาประเมิน เริ่มที่ 50,000
    const rem=r.pr-(r.db||0); r.sp=rem>0?ceilP(rem*r.fac):50000; r.spSrc=rem>0?'ประมาณ · ส่วนเกินหนี้':'หนี้เกินราคาประเมิน'; r.cost=r.sp+(r.db||0);
  } else { r.sp=r.fb?r.fb.sp:ceilP(r.pr*r.fac); r.spSrc=r.fb?'บัญชี FB':'ประมาณ'; }
  let li=-1; r.d.forEach((d,j)=>{if(d<TODAY&&r.s[j]!==0)li=j}); r.li=li; r.lastCode=li>=0?r.s[li]:null;
  {const m=(r.lot||'').match(/([ก-๙]{1,3}\.[ก-๙]{1,3}\.)\s*\/\s*\d{2}(\d{2})/);r.lotTxt=m?`ล็อต ${m[1]} ${m[2]}`:'ล็อต '+(r.lot||'').replace(/\s*-\s*1$/,'');}
  r.isNew=r.ni===0; r.roundTxt=r.next?`นัดที่ ${r.ni+1}/${r.d.length}`:'ครบทุกนัดแล้ว';
  r.slip=r.nob?`ไม่มีผู้สู้ราคามาแล้ว ${r.nob} นัด`:(r.isNew?'ทรัพย์ใหม่ ยังไม่เคยประมูล':'');
  return r;
}
function addHist(r,H){
  r.hk=(r.cs||'').replace(/[\s.]/g,'')+'|'+String(r.dn||'').trim().split(/[,\-\s]/)[0];
  r.H=(H.h&&H.h[r.hk])||[];
  const cur=new Set(r.d); const prevDates=[...new Set(r.H.filter(x=>!cur.has(x[0])).map(x=>x[0]))];
  r.prevN=prevDates.length; r.relist=r.prevN>0;
  const soldH=r.H.find(x=>x[3]>0); r.soldPrice=soldH?soldH[3]:0; r.soldDate=soldH?soldH[0]:'';
  r.caseYear=+((r.cs||'').split('/')[1]||0); r.caseAge=r.caseYear?2569-r.caseYear:0;
  return r;
}
async function load(area){
  if(DATA[area]) return;
  const [d,b,h]=await Promise.all([fetch(AREAS[area].data,{cache:'no-cache'}).then(r=>r.json()),fetch(AREAS[area].base,{cache:'no-cache'}).then(r=>r.json()),
    AREAS[area].hist?fetch(AREAS[area].hist,{cache:'no-cache'}).then(r=>r.json()).catch(()=>null):null]);
  HIST[area]=h||{h:{},sold:[],stat:{}}; BASE[area]=b;
  let sv=[]; if(AREAS[area].seen){try{sv=await fetch(AREAS[area].seen,{cache:'no-cache'}).then(r=>r.json())}catch(e){}}
  SEEN[area]=sv; const byK=Object.fromEntries(sv.map(g=>[g.k,g])); SEENK[area]=byK;
  DATA[area]=d.map(r=>{addHist(derive(r),HIST[area]);const g=byK[r.hk];if(g){r.seenG=g;r.spec=!!g.sp;g.cur=g.cur||[];g.cur.push(r);
    // ทรัพย์ที่เคยดู ถ้ายังอยู่ในประกาศ ให้ถือเป็นเฝ้าดูด้วย
  }
    if(r.red&&r.soldPrice)r.won=1;return r});
}

// ---------- my lists (db per person, fallback to this device) ----------
let MY={}, NOTES={}, saveMode='local', dbRef=null;
try{MY=JSON.parse(localStorage.getItem('led_my')||'{}');NOTES=JSON.parse(localStorage.getItem('led_notes')||'{}')}catch(e){}
// pw = เฝ้าดูจากโฟลเดอร์ Drive (ไฟล์ขึ้นต้น 0) · 'none' = ผู้ใช้เอาออกเอง
const kindOf=r=>{const v=MY[r.k];return v==='none'?undefined:(v||(r.pw?'watch':undefined))};
const noteOf=r=>NOTES[r.k]!=null?NOTES[r.k]:(r.pn||(r.seenG&&r.seenG.parked?r.seenG.note:'')||'');
function setSync(){const t=saveMode==='db'?'บันทึกในบัญชีของคุณ เปิดจาก iPad/คอมก็เห็นเหมือนกัน':'บันทึกเฉพาะเครื่องนี้';document.querySelectorAll('.sync').forEach(e=>e.textContent=t)}
async function initDb(){
  if(!window.claude||!claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('data/users/'+id+'/watch');
    dbRef.onSnapshot(s=>{
      if(s.exists){if(s.metadata&&s.metadata.hasPendingWrites)return; const d=s.data();
        const dec=v=>Array.isArray(v)?Object.fromEntries(v):Object.assign({},v||{});
        const m=dec(d.pairs?d.items:d.items),n=dec(d.notes);
        // แผนเดิมเก็บเป็น map (บันทึกไม่ผ่านเพราะ key มี / และ .) → รวมค่าที่ค้างในเครื่องเข้าไปด้วย
        if(!d.pairs){Object.assign(m,MY);Object.assign(n,NOTES)}
        const same=JSON.stringify(m)===JSON.stringify(MY)&&JSON.stringify(n)===JSON.stringify(NOTES);
        MY=m; NOTES=n; const first=saveMode!=='db'; saveMode='db'; if(!d.pairs) writeMy(); if(!same||first) refreshAll(); else setSync();}
      else if(saveMode!=='db'){saveMode='db';const local=Object.keys(MY).length+Object.keys(NOTES).length; if(local) writeMy(); refreshAll();}
    },()=>{saveMode='local';dbRef=null;setSync()});
  }catch(e){}
}
let writing=Promise.resolve();
function writeMy(){
  try{localStorage.setItem('led_my',JSON.stringify(MY));localStorage.setItem('led_notes',JSON.stringify(NOTES))}catch(e){}
  if(dbRef&&saveMode==='db'){const items=Object.entries(MY),notes=Object.entries(NOTES);writing=writing.then(()=>dbRef.set({pairs:1,items,notes})).then(()=>{noteFlag('บันทึกแล้ว')}).catch(e=>{noteFlag('⚠️ บันทึกไม่สำเร็จ ('+(e&&e.code||'error')+') เก็บในเครื่องนี้ไว้ก่อน');if(e&&e.code==='invalid_argument'){saveMode='local';dbRef=null;setSync()}})}
}
// ---- รายการรอกลับมา: จากโฟลเดอร์ Drive (seen.parked) + ที่ผู้ใช้กดเพิ่มเอง (MY['p|'+hk])
const PK=hk=>'p|'+hk;
function parkOf(r){const m=MY[PK(r.hk)];if(m==='none')return null;if(m&&typeof m==='object')return {since:m.since,snap:m.snap,manual:1};
  const g=r.seenG;return g&&g.parked?{since:g.since,g}:null}
const isBack=r=>{const p=parkOf(r);return !!p&&!r.red&&(r.d[0]||'')>(p.since||'')};
function parkToggle(k){const r=allRows().find(x=>x.k===k);if(!r)return;const p=parkOf(r);
  if(p&&!isBack(r)){if(p.manual&&!(r.seenG&&r.seenG.parked))delete MY[PK(r.hk)];else MY[PK(r.hk)]='none'}
  else MY[PK(r.hk)]={since:r.d[0]||TODAY,snap:{seq:r.seq,lotTxt:r.lotTxt,ty:r.ty,tb:r.tb,am:r.am,pr:r.pr,pic:r.pic,dn:r.dn,cs:r.cs,kind:r.kind,area:r.area,note:noteOf(r),lat:r.lat,lon:r.lon,approx:r.approx||0,db:r.db||0}};
  writeMy();refreshAll();if(r.mk&&r.mk.isPopupOpen&&r.mk.isPopupOpen())r.mk.setPopupContent(pop(r))}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-park]');if(!b)return;e.stopPropagation();parkToggle(b.dataset.park)});
// รวมรายการรอของสำนักงาน: [{hk, since, g?, snap?, rows:[แถวปัจจุบันที่ตรงกัน], back:แถวที่กลับมา}]
function parkList(a){const rows=DATA[a]||[],by={};rows.forEach(r=>{(by[r.hk]=by[r.hk]||[]).push(r)});const out=[],seen=new Set();
  (SEEN[a]||[]).forEach(g=>{seen.add(g.k);const m=MY[PK(g.k)];if(m==='none')return;const man=m&&typeof m==='object'?m:null;if(!g.parked&&!man)return;
    const since=man?man.since:g.since,rs=by[g.k]||[];out.push({hk:g.k,since,g,snap:man&&man.snap,rows:rs,back:rs.find(r=>!r.red&&(r.d[0]||'')>since)})});
  Object.keys(MY).filter(k=>k.startsWith('p|')&&typeof MY[k]==='object').forEach(k=>{const hk=k.slice(2);if(seen.has(hk))return;const m=MY[k];if(m.snap.area!==a)return;
    const rs=by[hk]||[];out.push({hk,since:m.since,snap:m.snap,rows:rs,back:rs.find(r=>!r.red&&(r.d[0]||'')>m.since)})});
  return out}
const allRows=()=>Object.values(DATA).flatMap(d=>d||[]);
function toggle(k,kind){const r=allRows().find(x=>x.k===k);if(!r)return;const cur=kindOf(r);
  if(cur===kind){if(r.pw)MY[k]='none';else delete MY[k]}else MY[k]=kind;writeMy();refreshAll();}
let lastNoteK='';function noteFlag(s){const f=lastNoteK&&document.getElementById('ns-'+lastNoteK);if(f)f.textContent=s}
function saveNote(k,txt){const r=allRows().find(x=>x.k===k);if(!r)return;txt=txt.trim();lastNoteK=k;
  if(txt===(r.pn||''))delete NOTES[k];else NOTES[k]=txt;writeMy();if(saveMode!=='db')noteFlag('บันทึกในเครื่องนี้แล้ว');else noteFlag('กำลังบันทึก…');}

// ---------- routing ----------
let route='home', view='map', F={date:'',type:'',debt:'',tb:'',max:0,mine:'',stat:'',lot:'',am:''};
function go(r){const h=r==='home'?'':r; if(location.hash.slice(1)!==h) location.hash=h; else show(r)}  // hashchange เรียก show เอง
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'home'));
$('btnHome').onclick=()=>go('home');
$('btnHub').onclick=()=>go('o-'+ROUTES[route].area);
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;renderRoute()};

async function show(r){
  r=ALIAS[r]||r; route=ROUTES[r]?r:'home'; $('btnHub').hidden=true;
  if(route==='home'){ $('tabs').hidden=true; $('title').textContent='บอร์ดทรัพย์ขายทอดตลาด'; $('sched').textContent=''; screen('sHome'); renderHome(); return; }
  const R=ROUTES[route]; await load(R.area);
  if(!R.hub){$('btnHub').hidden=false;$('btnHub').textContent='‹ '+AREAS[R.area].short}
  if(R.hub){ $('tabs').hidden=true; $('title').textContent=R.title; $('sched').textContent=AREAS[R.area].sched; screen('sHome'); renderHub(R.area); return; }

  $('upd').innerHTML=h; bindRows($('upd'));
}
